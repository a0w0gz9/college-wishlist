        }
        
        body {
            font-family: 'Crimson Text', Georgia, serif;
            background: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.88)), url('./Buildings/UM\ backdrop.png') fixed center/cover;
            min-height: 100vh;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Varsity', 'Collegiate', Georgia, serif;
            letter-spacing: 2px;
        }
        
        h1 {
            font-size: 3.5rem;
            color: #00274C;
        }
        
        h2 {
            font-size: 2.5rem;
            color: #00274C;
        }
        
        h3 {
            font-size: 1.8rem;
            color: #00274C;
        }
        
        .michigan-header {
            background: linear-gradient(135deg, #00274C 0%, #003d7a 100%);

            padding: 3rem 0;

            border-bottom: 6px solid #FFCB05;
        }
        
        .header-top {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 3rem;
            margin-bottom: 2rem;
        }
        
        .baby-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 6px solid #FFCB05;
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }
        
        .michigan-m {
            font-size: 6rem;
            font-weight: bold;
            color: #FFCB05;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .nav-menu a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            font-family: 'Varsity', Georgia, serif;
            letter-spacing: 1px;
        }
        
        .nav-menu a:hover {
            background-color: #FFCB05;
            color: #00274C;
            transform: translateY(-2px);
        }
        
        .nav-menu a.active {
            background-color: #FFCB05;
            color: #00274C;
        }
        
        .item-card {
            background: white;
            border-left: 4px solid #00274C;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin: 1rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .item-card:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }
        
        .item-card.claimed {
            background-color: #f0f8ff;
            border-left-color: #FFCB05;
        }
        
        .category-header {
            background: linear-gradient(90deg, #00274C 0%, #003d7a 100%);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            margin: 2rem 0 1rem 0;
            font-size: 1.25rem;
            font-weight: bold;
            font-family: 'Varsity', Georgia, serif;
            letter-spacing: 1px;
        }
        
        .claim-button {
            background-color: #00274C;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Varsity', Georgia, serif;
        }
        
        .claim-button:hover {
            background-color: #003d7a;
            transform: scale(1.05);
        }
        
        .claim-button.claimed {
            background-color: #FFCB05;
            color: #00274C;
        }
        
        .price-tag {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00274C;
            margin: 0.5rem 0;
        }

            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow: auto;
        }

            display: flex;
            align-items: center;
            justify-content: center;
        }

            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

            font-size: 1.5rem;
            font-weight: bold;
            color: #00274C;
            margin-bottom: 1rem;
            border-bottom: 3px solid #FFCB05;
            padding-bottom: 0.5rem;
            font-family: 'Varsity', Georgia, serif;
        }

            margin: 1rem 0;
        }

            display: block;
            font-weight: 600;
            color: #00274C;
            margin-bottom: 0.5rem;
            font-family: 'Varsity', Georgia, serif;
        }

            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #00274C;
            box-shadow: 0 0 5px rgba(0, 39, 76, 0.3);
        }

            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .button-group button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;

            background-color: #00274C;
            color: white;

            background-color: #003d7a;
        }

    <!-- Header with Navigation -->
    <div class="michigan-header">
        <div class="max-w-7xl mx-auto px-4">
            <div class="header-top">
                <img src="./Faces/Oye Yoy Yoy.jpeg" alt="Olivia" class="baby-photo">
                <div class="flex-1">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <div class="michigan-m">M</div>
                        <div>
                            <h1 style="margin: 0; font-size: 4rem;">GO BLUE!</h1>
                            <p style="font-size: 1.3rem; color: #FFCB05; margin: 0; margin-top: 0.5rem;">Olivia's College Wishlist</p>
                            <p style="font-size: 1rem; color: #fff; margin: 0; margin-top: 0.25rem;">University of Michigan Class of 2026</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="active">🏠 Home</a>
                <a href="gallery.html">📸 Gallery</a>
                <button onclick="showAdminLogin()" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.1rem; padding: 0.5rem 1rem; text-decoration: none; font-weight: 600;">⚙️ Admin</button>
            </div>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="max-w-6xl mx-auto px-4 pb-8">
        <!-- Claim Button -->
        <div class="text-center my-8">
            <button onclick="showClaimModal()" class="claim-button px-8 py-3 text-lg">✨ Claim an Item for Olivia ✨</button>
        </div>
        
        <!-- AVAILABLE ITEMS SECTION -->
        <div id="availableSection">
            <div class="text-center my-8">
                <h2>📦 Items Olivia Needs</h2>
                <p class="text-gray-700 mt-2 text-lg">Help her get ready for U of M! Click an item to see details and claim it.</p>
            </div>
            <div id="availableItems"></div>
        </div>
        
        <!-- CLAIMED ITEMS SECTION -->
        <div id="claimedSection" style="display:none;">
            <div class="category-header">🎁 Already Claimed Items</div>
            <div id="claimedItems"></div>
        </div>
    </div>
    
    <!-- MODALS -->
    
    <!-- Claim Modal -->
    <div id="claimModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Claim an Item for Olivia</div>
            <form id="claimForm">
                <div class="form-group">
                    <label for="claimName">Your Name *</label>
                    <input type="text" id="claimName" required placeholder="e.g., Grandma Smith">
                </div>
                <div class="form-group">
                    <label for="claimItem">Which Item? *</label>
                    <input type="text" id="claimItem" required placeholder="e.g., Twin XL Sheets">
                </div>
                <div class="form-group">
                    <label for="claimEmail">Email (optional)</label>
                    <input type="email" id="claimEmail" placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label for="claimMessage">Personal Message (optional - only Ali sees this)</label>
                    <textarea id="claimMessage" rows="3" placeholder="e.g., I'll get this for graduation!"></textarea>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn-primary">✅ Claim Item</button>
                    <button type="button" class="btn-secondary" onclick="closeClaimModal()">❌ Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Item Detail Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="itemModalTitle">Item Details</div>
            <div id="itemModalBody"></div>
            <div class="button-group">
                <button type="button" class="btn-secondary" onclick="closeItemModal()">Close</button>
            </div>
        </div>
    </div>
    
    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">🔐 Admin Login</div>
            <div class="form-group">
                <label for="adminPassword">Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password">
            </div>
            <div class="button-group">
                <button type="button" class="btn-primary" onclick="verifyAdminPassword()">Login</button>
                <button type="button" class="btn-secondary" onclick="closeAdminLogin()">Cancel</button>
            </div>
        </div>
    </div>
    
    <!-- Admin Panel Modal -->
    <div id="adminPanelModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">⚙️ Admin Panel - Add New Item</div>
            <form id="addItemForm">
                <div class="form-group">
                    <label for="itemName">Item Name *</label>
                    <input type="text" id="itemName" required placeholder="e.g., Cozy Earth Bath Towel">
                </div>
                <div class="form-group">
                    <label for="itemCategory">Category *</label>
                    <select id="itemCategory" required style="width: 100%; padding: 0.75rem; border: 2px solid #ddd; border-radius: 0.5rem; font-size: 1rem; font-family: inherit;">
                        <option value="">-- Select Category --</option>
                        <option value="Bath">Bath</option>
                        <option value="Bedding">Bedding</option>
                        <option value="Storage">Storage</option>
                        <option value="Giftable Items">Giftable Items</option>
                        <option value="Travel Items">Travel Items</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="itemPrice">Price</label>
                    <input type="text" id="itemPrice" placeholder="e.g., $45 or TBD">
                </div>
                <div class="form-group">
                    <label for="itemDescription">Description *</label>
                    <textarea id="itemDescription" required rows="3" placeholder="Brief description of the item"></textarea>
                </div>
                <div class="form-group">
                    <label for="itemLink">Product Link *</label>
                    <input type="url" id="itemLink" required placeholder="https://example.com/product">
                </div>
                <div class="form-group">
                    <label for="itemImage">Image URL *</label>
                    <input type="url" id="itemImage" required placeholder="https://example.com/image.jpg">
                </div>
                <div class="button-group">
                    <button type="submit" class="btn-primary">✅ Add Item</button>
                    <button type="button" class="btn-secondary" onclick="closeAdminPanel()">❌ Cancel</button>
                </div>
            </form>
        </div>
    </div>

        const adminPassword = 'Wolverine2026';
        
        // Modal Functions
        function showClaimModal() {
            document.getElementById('claimModal').classList.add('show');
        }
        
        function closeClaimModal() {
            document.getElementById('claimModal').classList.remove('show');
        }
        
        function closeItemModal() {
            document.getElementById('itemModal').classList.remove('show');
        }
        
        // Claim Form
        document.getElementById('claimForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const claimData = {
                name: document.getElementById('claimName').value,
                item: document.getElementById('claimItem').value,
                email: document.getElementById('claimEmail').value,
                message: document.getElementById('claimMessage').value,
                timestamp: new Date().toLocaleString()
            };
            
            db.ref('claims').push(claimData).then(() => {
                alert('✅ Thank you! Your claim has been recorded. Ali will confirm the details.');
                closeClaimModal();
                document.getElementById('claimForm').reset();
                loadWishlist();
            }).catch(error => {
                alert('Error saving claim: ' + error.message);
            });
        });
        
        // ADMIN FUNCTIONS
        let isAdmin = false;
        
        function showAdminLogin() {
            document.getElementById('adminLoginModal').classList.add('show');
        }
        
        function closeAdminLogin() {
            document.getElementById('adminLoginModal').classList.remove('show');
            document.getElementById('adminPassword').value = '';
        }
        
        function verifyAdminPassword() {
            const password = document.getElementById('adminPassword').value;
            if (password === adminPassword) {
                isAdmin = true;
                closeAdminLogin();
                document.getElementById('adminPanelModal').classList.add('show');
            } else {
                alert('❌ Incorrect password!');
            }
        }
        
        function closeAdminPanel() {
            document.getElementById('adminPanelModal').classList.remove('show');
            document.getElementById('addItemForm').reset();
        }
        
        // Handle Add Item Form
        document.getElementById('addItemForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newItem = {
                id: 'item-' + Date.now(),
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                price: document.getElementById('itemPrice').value,
                description: document.getElementById('itemDescription').value,
                link: document.getElementById('itemLink').value,
                image: document.getElementById('itemImage').value,
                addedBy: 'admin',
                timestamp: new Date().toLocaleString()
            };
            
            // Save to Firebase
            db.ref('items/' + newItem.id).set(newItem).then(() => {
                alert('✅ Item added successfully!');
                closeAdminPanel();
                loadWishlist(); // Reload to show new item
            }).catch(error => {
                alert('Error adding item: ' + error.message);
            });
        });
        
        // Load and Display Wishlist
        function loadWishlist() {
            const availableDiv = document.getElementById('availableItems');
            availableDiv.innerHTML = '';
            
            // Load Firebase items
            db.ref('items').once('value', (snapshot) => {
                const firebaseItems = snapshot.val() || {};
                
                // Merge Firebase items with hardcoded data
                const allSections = { ...wishlistData };
                
                Object.keys(firebaseItems).forEach(itemId => {
                    const item = firebaseItems[itemId];
                    if (!allSections[item.category]) {
                        allSections[item.category] = [];
                    }
                    allSections[item.category].push(item);
                });
                
                // Display all items
                Object.keys(allSections).forEach(section => {
                    availableDiv.innerHTML += `<div class="category-header">📌 ${section}</div>`;
                    
                    allSections[section].forEach(item => {
                        const itemHTML = `
                            <div class="item-card">
                                <div class="flex justify-between items-start">
                                    <div class="flex-1">
                                        <h3 class="text-xl font-bold text-engineering">${item.name}</h3>
                                        <p class="text-gray-600 text-sm mt-1">${item.category}</p>
                                        <div class="price-tag">${item.price}</div>
                                        <p class="text-gray-700 mt-2">${item.description}</p>
                                    </div>
                                    <button onclick="showItemDetail('${item.id}')" class="claim-button ml-4 whitespace-nowrap">View Details</button>
                                </div>
                            </div>
                        `;
                        availableDiv.innerHTML += itemHTML;
                    });
                });
            });
        }
        
        function showItemDetail(itemId) {
            let item;
            for (let section in wishlistData) {
                item = wishlistData[section].find(i => i.id === itemId);
                if (item) break;
            }
            
            if (item) {
                document.getElementById('itemModalTitle').textContent = item.name;
                document.getElementById('itemModalBody').innerHTML = `
                    <img src="${item.image}" style="width: 100%; height: auto; border-radius: 0.5rem; margin: 1rem 0;">
                    <p><strong>Category:</strong> ${item.category}</p>
                    <p><strong>Price:</strong> $${item.price}</p>
                    <p><strong>Description:</strong> ${item.description}</p>
                    <a href="${item.link}" target="_blank" class="btn-primary inline-block mt-4 px-4 py-2 text-white text-decoration-none rounded">🛒 View on Store</a>
                `;
                document.getElementById('itemModal').classList.add('show');
            }
        }
        
        // Close modals when clicking outside
        window.onclick = function(event) {
            const claimModal = document.getElementById('claimModal');
            const itemModal = document.getElementById('itemModal');
            
            if (event.target == claimModal) claimModal.classList.remove('show');
            if (event.target == itemModal) itemModal.classList.remove('show');
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadWishlist);
    </script>
